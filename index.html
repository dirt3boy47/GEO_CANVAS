<html lang="en-AU">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="map" aria-label="Map"></div>
<div id="crosshair" aria-hidden="true"></div>

<header id="topbar" class="panel">
  <button class="ib" id="btn-sidebar" title="Layers" aria-label="Toggle layers panel"><svg><use xlink:href="#i-sidebar"/></svg></button>
  <button class="ib" id="btn-projects" title="Projects" aria-label="Projects"><svg><use xlink:href="#i-folder"/></svg></button>
  <div class="title-block"><div id="project-name">GeoCanvas</div><div><button id="ws-tag" class="ws-tag" hidden></button><span id="save-status">Saved</span><span id="cloud-status"></span></div></div>
  <div class="seg" role="group" aria-label="Mode">
    <button id="mode-nav" class="on"><svg><use xlink:href="#i-hand"/></svg><span>Navigate</span></button>
    <button id="mode-draw"><svg><use xlink:href="#i-ballpoint"/></svg><span>Draw</span></button>
  </div>
  <div class="spacer"></div>
  <button class="tb" id="btn-add" title="Add files and maps" aria-haspopup="true"><svg><use xlink:href="#i-plus"/></svg><span>Add</span></button>
  <button class="tb" id="btn-map" title="Background map, lot boundaries and offline maps" aria-haspopup="true"><svg><use xlink:href="#i-layers"/></svg><span>Map</span></button>
  <button class="tb" id="btn-camera" title="Take a photo and pin it where you are"><svg><use xlink:href="#i-camera"/></svg><span>Camera</span></button>
  <button class="tb" id="btn-photos" title="Actions register: every photo, pin and drawn action with its category, importance, checked tick and time"><svg><use xlink:href="#i-photos"/></svg><span>Actions</span></button>
  <button class="tb" id="btn-measure" title="Measure distance and area"><svg><use xlink:href="#i-ruler"/></svg><span>Measure</span></button>
  <button class="tb" id="btn-search" title="Search places, coordinates and lots"><svg><use xlink:href="#i-search"/></svg><span>Search</span></button>
  <button class="tb" id="btn-gps" title="GPS position, tracks and waypoints"><svg><use xlink:href="#i-gps"/></svg><span>GPS</span></button>
  <button class="tb" id="btn-export" title="Export and share"><svg><use xlink:href="#i-export"/></svg><span>Share</span></button>
  <span class="sep"></span>
  <button class="ib" id="btn-undo" title="Undo" aria-label="Undo" disabled><svg><use xlink:href="#i-undo"/></svg></button>
  <button class="ib" id="btn-redo" title="Redo" aria-label="Redo" disabled><svg><use xlink:href="#i-redo"/></svg></button>
  <button class="ib cloud-btn off" id="btn-cloud" title="Your account, teams and cloud" aria-label="Your account, teams and cloud"><svg><use xlink:href="#i-cloud"/></svg><i class="cdot"></i></button>
  <button class="ib" id="btn-help" title="Help" aria-label="Help"><svg><use xlink:href="#i-help"/></svg></button>
  <button class="ib" id="btn-settings" title="Settings" aria-label="Settings"><svg><use xlink:href="#i-gear"/></svg></button>
  <input type="file" id="file-input" multiple hidden>
  <input type="file" id="restore-input" accept=".json,.geocanvas,application/json" hidden>
</header>

<div id="add-menu" class="panel pop menu" hidden role="menu">
  <button class="menu-row" id="btn-import" role="menuitem"><svg><use xlink:href="#i-import"/></svg><span><b>Import a file</b><small>KML/KMZ, GeoPDF, shapefile, DXF, GeoTIFF, GPX, GeoJSON, PDF or photo plans</small></span></button>
  <button class="menu-row" id="am-mymaps" role="menuitem"><svg><use xlink:href="#i-folder"/></svg><span><b>My maps</b><small>The team’s topo sheets, plans and saved maps</small></span></button>
  <button class="menu-row" id="am-online" role="menuitem"><svg><use xlink:href="#i-globe"/></svg><span><b>Online maps</b><small>Geology, topographic and tenement maps from Geoscience Australia and Queensland</small></span></button>
  <button class="menu-row" id="am-layer" role="menuitem"><svg><use xlink:href="#i-ballpoint"/></svg><span><b>New drawing layer</b><small>A separate layer for Pencil notes, shapes and markers</small></span></button>
  <div class="menu-head">New action</div>
  <button class="menu-row" id="am-pin" role="menuitem"><svg><use xlink:href="#i-gpt"/></svg><span><b>Pin at my position</b><small>Category, importance and note; or press and hold the map to pin a spot</small></span></button>
  <button class="menu-row" id="am-area" role="menuitem"><svg><use xlink:href="#i-gpoly"/></svg><span><b>Draw an action area</b><small>Tap the corners or trace with the Pencil, then Create action</small></span></button>
  <button class="menu-row" id="am-line" role="menuitem"><svg><use xlink:href="#i-gline"/></svg><span><b>Draw an action line</b><small>A fence, trench or run to fix, then Create action</small></span></button>
</div>
<div id="map-panel" class="panel pop" hidden>
  <div class="pop-title">Map <button class="ib" id="mp-close" title="Close" aria-label="Close">&times;</button></div>
  <div class="pop-title small">Background</div>
  <div class="bm-grid" id="bm-grid"></div>
  <select id="basemap" aria-label="Background map" hidden></select>
  <div class="pop-title small">Show on top</div>
  <label class="sw-row"><span><b>Lot boundaries</b><small>QLD cadastre · tap a lot for its details</small></span><input type="checkbox" id="ref-cad" class="toggle"></label>
  <label class="sw-row"><span><b>Darken the imagery</b><small>Helps map lines and drawings stand out</small></span><input type="checkbox" id="mp-dim" class="toggle"></label>
  <div class="pop-title small">No signal?</div>
  <button class="sw-row mp-off" id="btn-offline"><span><b>Offline maps</b><small id="mp-off-status">Save areas of imagery to use without signal</small></span><svg><use xlink:href="#i-offline"/></svg></button>
</div>

<aside id="sidebar" class="panel">
  <div class="tabs"><button data-tab="layers" class="on">Layers</button><button data-tab="project">Project</button></div>
  <div id="tab-layers" class="tab">
    <div class="tab-head"><span id="layer-count"></span><button class="link" id="btn-add-layer"><svg><use xlink:href="#i-plus"/></svg>New drawing layer</button></div>
    <button class="btn lib-open" id="btn-mymaps"><svg><use xlink:href="#i-folder"/></svg><span>My maps <small>topo sheets, plans, online maps</small></span></button>
    <ul id="layer-list"></ul>
    <p class="hint lhint">⋯ layer options · ⠿ drag to reorder · double-tap to zoom · <a href="#" id="layers-help">More tips</a></p>
  </div>
  <div id="tab-project" class="tab" hidden>
    <label class="field">Project name<input id="proj-name" type="text"></label>
    <label class="field">Notes<textarea id="proj-notes" rows="7" placeholder="Field notes, site details, contacts…"></textarea></label>
    <div id="proj-cloud">
      <div class="pop-title small">Team cloud</div>
      <p class="hint" id="proj-cloud-status" style="margin:0 6px 6px"></p>
      <div class="row-btns"><button class="btn" id="proj-cloud-sync">Save now</button></div>
    </div>
    <div class="row-btns"><button class="btn" id="btn-backup">Back up project</button><button class="btn" id="btn-restore">Restore backup</button></div>
    <p class="hint" id="storage-note"></p>
  </div>
</aside>


<div id="selbar" class="panel" hidden>
  <span id="sel-count"></span>
  <button class="ib" id="sel-color" title="Recolour"><svg><use xlink:href="#i-palette"/></svg></button>
  <select id="sel-layer" aria-label="Move to layer"></select>
  <button class="ib" id="sel-dup" title="Duplicate"><svg><use xlink:href="#i-copy"/></svg></button>
  <button class="ib danger" id="sel-del" title="Delete"><svg><use xlink:href="#i-trash"/></svg></button>
  <button class="ib" id="sel-clear" title="Deselect"><svg><use xlink:href="#i-close"/></svg></button>
</div>

<div id="toolbar" class="panel" hidden>
  <div id="tools"></div>
  <span class="sep"></span>
  <div id="swatches"></div>
  <button id="btn-colors" class="rainbow" title="More colours" aria-label="More colours"><span id="cur-color"></span></button>
  <span class="sep"></span>
  <button id="btn-width" class="width-prev" title="Thickness and opacity"><span id="width-line"></span></button>
  <select id="active-layer" aria-label="Draw on layer"></select>
  <button class="ib" id="btn-done" title="Finish drawing"><svg><use xlink:href="#i-close"/></svg></button>
</div>

<div id="popover-width" class="panel pop" hidden>
  <div class="pop-title" id="width-title">Thickness</div>
  <label class="slider">Thickness <output id="width-val"></output><input type="range" id="width-range" min="0.5" max="24" step="0.5"></label>
  <label class="slider">Opacity <output id="op-val"></output><input type="range" id="op-range" min="5" max="100" step="1"></label>
  <label class="slider" id="text-size-row">Text size <output id="ts-val"></output><input type="range" id="ts-range" min="10" max="64" step="1"></label>
  <div id="eraser-row" class="seg small"><button data-er="object" class="on">Whole object</button><button data-er="precision">Precision</button></div>
  <div id="shape-row"><label class="check"><input type="checkbox" id="shape-fill"> Fill closed shapes</label><label class="check"><input type="checkbox" id="shape-dash"> Dashed outline</label></div>
  <p class="hint" id="ink-hint"></p>
</div>

<div id="popover-colors" class="panel pop" hidden>
  <div class="pop-title">Colour</div>
  <div id="palette"></div>
  <div class="pop-title small">Recent</div>
  <div id="recent"></div>
  <label class="custom">Custom <input type="color" id="custom-color"></label>
</div>

<div id="popover-shapes" class="panel pop" hidden><div id="shape-tools"></div></div>

<div id="photo-view" hidden>
  <img id="pv-img" alt="">
  <button class="pv-btn" id="pv-prev" aria-label="Previous photo">‹</button><button class="pv-btn" id="pv-next" aria-label="Next photo">›</button>
  <div id="pv-bar"><span id="pv-cap"></span><span class="spacer"></span><button class="btn" id="pv-share">Share / Save</button><button class="btn danger" id="pv-del">Remove</button><button class="btn primary" id="pv-close">Close</button></div>
</div>
<div id="georef" hidden>
  <div id="gr-plan"><div id="gr-planmap"></div></div>
  <div id="gr-bar" class="panel">
    <div class="pop-title" id="gr-title">Place plan</div>
    <p class="hint" id="gr-step"></p>
    <div id="gr-pairs"></div>
    <label class="opt"><input type="checkbox" id="gr-affine"> Allow stretch and skew (scanned or distorted plans, 3+ points)</label>
    <label class="opt"><input type="checkbox" id="gr-blend" checked> Hide white paper</label>
    <label class="slider">Plan opacity <output id="gr-opv">70%</output><input type="range" id="gr-op" min="10" max="100" value="70"></label>
    <div class="row-btns"><button class="btn" id="gr-undo">Undo</button><button class="btn" id="gr-cancel">Cancel</button><button class="btn primary" id="gr-save">Save plan</button></div>
  </div>
</div>
<div id="measure-panel" class="panel pop" hidden>
  <div class="pop-title"><span id="ms-title">Measure</span> <button class="ib" id="ms-close" title="Close measuring" aria-label="Close">&times;</button></div>
  <div class="seg" id="ms-mode"><button data-m="line" class="on">Line</button><button data-m="area">Area</button></div>
  <label class="opt"><input type="checkbox" id="ms-free"> Freehand: trace a winding line or outline</label>
  <div id="ms-out"></div>
  <p class="hint" id="ms-hint"></p>
  <div class="row-btns"><button class="btn" id="ms-undo">Undo</button><button class="btn" id="ms-clear">Clear</button><button class="btn" id="ms-save">Save to map</button><button class="btn primary" id="ms-action">Create action</button></div>
</div>
<div id="gps-panel" class="panel pop" hidden>
  <div class="pop-title">GPS <span id="gps-badge" class="badge">Off</span></div>
  <div id="gps-warn" class="warn" hidden></div>
  <dl id="gps-data"></dl>
  <div class="row-btns"><button class="btn" id="gps-follow">Follow me</button><button class="btn" id="gps-compass">Compass</button></div>
  <div class="pop-title small">Track</div>
  <div id="gps-track-info" class="hint">Not recording.</div>
  <div class="row-btns"><button class="btn rec" id="gps-rec">Start recording</button></div>
  <div class="pop-title small">Waypoint</div>
  <input id="wp-name" type="text" placeholder="Name (e.g. Outcrop 3)">
  <input id="wp-note" type="text" placeholder="Note">
  <div class="row-btns"><button class="btn primary" id="gps-wp">Drop waypoint here</button><button class="btn" id="gps-photo">📷 Photo waypoint</button></div>
</div>

<div id="hud" class="panel"><span id="hud-coord">—</span><span id="hud-zoom"></span></div>
<div id="toasts" aria-live="polite"></div>
<div id="busy" class="panel" hidden><span class="spinner"></span><span id="busy-text"></span></div>

<div id="modal-wrap" hidden><div id="modal" class="panel" role="dialog" aria-modal="true"></div></div>
